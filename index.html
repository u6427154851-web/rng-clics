<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RNG clics</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#1f2430;--paper:#f6f7fb;--card:#ffffffd9;--line:#1f2430;--accent:#ffb02e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ink:#eef0f7;--paper:#1b1e2a;--card:#272b3bd9;--line:#eef0f7}}
:root[data-theme="dark"]{--ink:#eef0f7;--paper:#1b1e2a;--card:#272b3bd9;--line:#eef0f7}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*{box-sizing:border-box}
body{margin:0;height:100%;font-family:"Baloo 2","Trebuchet MS",system-ui,sans-serif;color:var(--ink);background:var(--paper);overflow:hidden}
#game{position:relative;height:100%;min-height:100vh;display:flex;overflow:hidden;transition:background .5s}
#fx{position:absolute;inset:0;pointer-events:none;overflow:hidden}
#scene{position:absolute;inset:0;pointer-events:none}
#scene svg{width:100%;height:100%;display:block}
#fx span svg{width:100%;height:auto;display:block}
#fx.up span{animation-direction:reverse}
#fx span{position:absolute;top:-10%;animation:fall linear infinite;opacity:.85}
@keyframes fall{to{transform:translateY(120vh) rotate(40deg)}}
@media (prefers-reduced-motion:reduce){#fx span{animation:none;top:calc(var(--y)*1%)}.rgb{animation:none!important}}
nav{position:relative;display:flex;flex-direction:column;justify-content:center;gap:12px;padding:16px 16px 16px 10px;width:136px;z-index:2}
nav button{font:inherit;font-weight:700;font-size:1rem;padding:12px 8px;border:2px solid var(--line);border-radius:14px;background:var(--paper);color:var(--ink);cursor:pointer;box-shadow:3px 3px 0 var(--line);transition:transform .08s,box-shadow .08s}
nav button:active{transform:translate(3px,3px);box-shadow:none}
button:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
main{position:relative;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:16px;color:var(--mc,var(--ink));z-index:1}
#score{font-size:clamp(3rem,10vw,5.5rem);font-weight:800;line-height:1;text-shadow:0 2px 0 #0003}
#sub{font-weight:700;opacity:.85}
#mouse{background:none;border:none;cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent;padding:0;width:clamp(150px,32vw,230px);transition:transform .06s;filter:drop-shadow(0 14px 14px #0005)}
#mouse svg{width:100%;height:auto;display:block}
#mouse:active{transform:scale(.92) translateY(4px)}
.rgb{animation:hue 3s linear infinite}
@keyframes hue{to{filter:hue-rotate(360deg)}}
.pop{position:fixed;font-weight:800;font-size:1.6rem;pointer-events:none;animation:up .8s ease-out forwards;color:#fff;text-shadow:0 2px 0 #000a;z-index:6}
@keyframes up{to{transform:translateY(-70px);opacity:0}}
#panel{position:fixed;inset:0;background:#0007;display:none;align-items:center;justify-content:center;z-index:5;padding:16px}
#panel.open{display:flex}
.sheet{background:var(--paper);border:2px solid var(--line);border-radius:18px;width:min(480px,100%);max-height:82vh;overflow:auto;padding:18px;box-shadow:6px 6px 0 var(--line)}
.sheet h2{margin:0 0 12px;font-size:1.6rem}
.row{display:flex;align-items:center;gap:12px;padding:8px 10px;border:2px solid var(--line);border-radius:12px;margin-bottom:8px;background:var(--card)}
.row .ic{font-size:1.8rem;width:2.4rem;text-align:center;flex:none}.row .t{flex:1;min-width:0;overflow-wrap:anywhere}.row small{display:block;opacity:.75}
.row button,.close{font:inherit;font-weight:700;border:2px solid var(--line);border-radius:10px;padding:6px 12px;background:var(--accent);color:#1f2430;cursor:pointer}
.row button:disabled{opacity:.5;cursor:not-allowed}
.row.me{background:var(--accent);color:#1f2430}
.tabs{display:flex;gap:8px;margin-bottom:10px}
.tab{font:inherit;font-weight:700;padding:6px 12px;border:2px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink);cursor:pointer}
.tab[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.close{margin-top:6px;background:var(--paper);color:var(--ink);width:100%}
.rk{width:2rem;font-weight:800;text-align:center;flex:none}
.sw{width:2.4rem;height:2.4rem;border-radius:10px;border:2px solid var(--line);flex:none}
.sheet input{font:inherit;width:100%;padding:8px 10px;border:2px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);margin-bottom:10px}
.live{font-weight:700;font-size:.9rem;margin-bottom:8px;display:flex;align-items:center;gap:6px}
.dot{width:10px;height:10px;border-radius:50%;background:#2fbf71;animation:pulse 1.4s infinite}.dot.off{background:#999;animation:none}
@keyframes pulse{50%{opacity:.3}}
#welcome{position:fixed;inset:0;background:#000b;align-items:center;justify-content:center;z-index:9;padding:16px}
#welcome p{margin:0 0 10px}
#who{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);right:12px;z-index:3;padding:6px 14px;border:2px solid var(--line);border-radius:999px;background:var(--paper);color:var(--ink);font-weight:800;box-shadow:3px 3px 0 var(--line);max-width:55vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#avail{font-weight:700;opacity:.9}
#mouse.auto{transform:scale(.94) translateY(3px)}
.mine:not(:empty){margin-top:10px;padding-top:10px;border-top:2px dashed var(--line)}
#werr{color:#d62839}
#req{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 56px);transform:translateX(-50%);z-index:8;display:none;width:min(360px,92vw)}
#req p{margin:0 0 10px}
#duel{position:fixed;inset:0;z-index:7;display:none;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:#000d;color:#fff;padding:16px;text-align:center}
#arena{display:flex;width:100%;max-width:720px;justify-content:space-around;align-items:flex-end}
.side{display:flex;flex-direction:column;align-items:center;gap:6px;width:44%}
.side b{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.side .n{font-size:3rem;font-weight:800;line-height:1}
.side button{background:none;border:none;padding:0;width:min(180px,34vw);cursor:pointer;filter:drop-shadow(0 12px 12px #0008)}
.side button:disabled{cursor:default}
.side svg{width:100%;display:block}
#big{font-size:clamp(2.6rem,12vw,6rem);font-weight:800;min-height:1.2em}
.shophead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.shophead h2{margin:0}
#who{display:flex;align-items:center;gap:8px}
#whoName{overflow:hidden;text-overflow:ellipsis}
#setBtn{font:inherit;font-size:1rem;line-height:1;background:none;border:none;padding:0;cursor:pointer;color:inherit}
.act{display:flex;flex-direction:column;align-items:stretch;gap:4px;flex:none}
.prev{font:inherit;font-size:.7rem;font-weight:700;padding:1px 8px;border:2px solid var(--line);border-radius:999px;background:var(--paper);color:var(--ink);cursor:pointer}
.sw2{display:block;width:100%;height:100%;border-radius:12px}
.sw3{display:block;width:28px;height:52px}
.coin{height:1em;width:1.4em;vertical-align:-.15em}
#ideaBtn{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 8px);left:10px;z-index:3;font:inherit;font-size:.75rem;font-weight:700;padding:3px 10px;border:2px solid var(--line);border-radius:999px;background:var(--paper);color:var(--ink);cursor:pointer;opacity:.9}
.sheet textarea{font:inherit;width:100%;min-height:90px;padding:8px 10px;border:2px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);margin-bottom:10px;resize:vertical}
.sheet h3{margin:14px 0 8px}
#ideaBtn,#newsBtn{min-width:96px;text-align:center}
#newsBtn{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 42px);left:10px;z-index:3;font:inherit;font-size:.75rem;font-weight:700;padding:3px 10px;border:2px solid var(--line);border-radius:999px;background:var(--paper);color:var(--ink);cursor:pointer;opacity:.9}
.upd ul{margin:6px 0 0;padding-left:18px}.upd li{margin:2px 0}
#newsBtn.dot::after{content:'';position:absolute;top:-5px;right:-5px;width:13px;height:13px;border-radius:50%;background:#e5252a;border:2px solid var(--paper)}
.orb{position:fixed;top:0;left:0;z-index:4;width:58px;height:58px;border-radius:50%;border:2px solid #fff9;background:radial-gradient(circle at 35% 30%,#fff7c2,#ffd23f 45%,#e09a00);box-shadow:0 0 18px 6px #ffd23faa;cursor:pointer;padding:0;font:inherit;font-size:1.2rem;font-weight:800;color:#7a4b00}
#bonus{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);left:50%;transform:translateX(-50%);z-index:3;display:none;padding:6px 14px;border-radius:999px;border:2px solid var(--line);background:linear-gradient(145deg,#fff1a8,#ffc21f);color:#5a3a00;font-weight:800;box-shadow:0 0 14px #ffd23f;white-space:nowrap}
#daily{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;z-index:9;padding:16px}
#ddays{display:flex;gap:6px;margin:10px 0}
#intro{position:fixed;inset:0;z-index:10;display:grid;place-items:center;background:radial-gradient(circle at 50% 45%,#3b2a6e,#0a0a2a 70%);animation:iOut .5s ease-in 2.5s forwards}
.ilogo{display:flex;flex-direction:column;align-items:center;line-height:.95;color:#fff;text-align:center}
.ilogo b{font-size:clamp(4rem,22vw,9rem);font-weight:800;letter-spacing:.04em;background:linear-gradient(180deg,#fff7c2,#ffc21f 60%,#e09a00);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 6px 0 #0006);animation:iPop .7s cubic-bezier(.2,1.6,.4,1) .15s both}
.ilogo i{font-style:normal;font-size:clamp(2.4rem,13vw,5.5rem);font-weight:800;animation:iUp .6s ease-out .75s both}
.ilogo::after{content:'';width:min(60vw,320px);height:6px;border-radius:9px;margin-top:18px;background:linear-gradient(90deg,transparent,#ffd23f,transparent);animation:iBar 1.4s ease-in-out 1s both}
@keyframes iPop{from{transform:scale(.2) rotate(-8deg);opacity:0}to{transform:none;opacity:1}}
@keyframes iUp{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
@keyframes iBar{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes iOut{to{opacity:0;visibility:hidden}}
@media (prefers-reduced-motion:reduce){.ilogo b,.ilogo i,.ilogo::after{animation:none}}
.dd{flex:1;text-align:center;padding:6px 2px;border:2px solid var(--line);border-radius:10px;font-weight:800;font-size:.8rem;background:var(--card)}
.dd.cur{background:var(--accent);color:#1f2430}.dd.done{opacity:.5}
.bal{font-weight:800;padding:6px 12px;border:2px solid var(--line);border-radius:999px;background:var(--accent);color:#1f2430;white-space:nowrap}
.item{display:flex;align-items:center;gap:12px;padding:12px;border:2px solid var(--line);border-radius:16px;margin-bottom:10px;background:var(--card);box-shadow:3px 3px 0 var(--line)}
.item.afford{border-color:#2fbf71;box-shadow:3px 3px 0 #2fbf71}
.item .tile{width:56px;height:56px;flex:none;display:grid;place-items:center;font-size:1.9rem;border-radius:14px;border:2px solid var(--line);background:linear-gradient(145deg,#ffe29a,#ffb02e)}
.item .body{flex:1;min-width:0}
.item .top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.lvl{font-size:.75rem;font-weight:800;padding:1px 8px;border-radius:999px;background:var(--ink);color:var(--paper)}
.lvl.ok{background:#2fbf71;color:#fff}
.item small{display:block;opacity:.8}
.eff{font-weight:700;font-size:.85rem;margin-top:2px}
.meter{height:7px;border-radius:99px;background:#0002;margin-top:6px;overflow:hidden}
.meter i{display:block;height:100%;background:linear-gradient(90deg,#2fbf71,#9be15d);transition:width .3s}
.buy{font:inherit;font-weight:800;border:2px solid var(--line);border-radius:12px;padding:8px 12px;background:var(--accent);color:#1f2430;cursor:pointer;box-shadow:2px 2px 0 var(--line);flex:none}
.buy:active{transform:translate(2px,2px);box-shadow:none}
.buy:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}
@media (max-width:520px){nav{width:100px;padding:10px 10px 10px 6px}nav button{font-size:.85rem}}
</style>
</head>

const NOTE=n=>440*Math.pow(2,(n-69)/12);
const PROG=[{n:[57,60,64,67],b:45},{n:[53,57,60,64],b:41},{n:[48,52,55,59],b:36},{n:[55,59,62,64],b:43}];
const MUS={on:false,iv:0,bar:0,next:0,gain:null};
function musTick(){
 if(!MUS.on)return;
 const beat=.75;
 while(MUS.next<AC.currentTime+1.5){
  const c=PROG[MUS.bar%4],t=MUS.next;
  const mn=(type,f,tt,dur,vol,att)=>{const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(.0001,tt);g.gain.linearRampToValueAtTime(vol,tt+att);g.gain.exponentialRampToValueAtTime(.0001,tt+dur);o.connect(g);g.connect(MUS.gain);o.start(tt);o.stop(tt+dur+.05)};
  c.n.forEach(n=>mn('sine',NOTE(n),t,beat*4,.07,.5));
  mn('sine',NOTE(c.b),t,beat*2,.2,.02);mn('sine',NOTE(c.b),t+beat*2,beat*2,.16,.02);
  [0,1,2,3,2,1,3,2].forEach((k,i)=>mn('triangle',NOTE(c.n[k]+12),t+i*beat/2,beat*1.4,.07,.01));
  MUS.next+=beat*4;MUS.bar++;
 }
}
function startMusic(){
 if(!S.musicOn||MUS.on)return;
 try{
  AC=AC||new (window.AudioContext||window.webkitAudioContext)();
  if(AC.state==='suspended')AC.resume();
  MUS.gain=AC.createGain();MUS.gain.gain.value=.35;MUS.gain.connect(AC.destination);
  MUS.on=true;MUS.next=AC.currentTime+.1;MUS.iv=setInterval(musTick,300);musTick();
 }catch(e){}
}
function stopMusic(){
 if(!MUS.on)return;MUS.on=false;clearInterval(MUS.iv);
 const g=MUS.gain;try{g.gain.setTargetAtTime(0,AC.currentTime,.12)}catch(e){}
 setTimeout(()=>{try{g.disconnect()}catch(e){}},900);
}

function shopItem(ic,t,d,lv,eff,c,btn){
 const pct=c?Math.min(100,Math.floor(S.score/c*100)):100,ok=c&&S.score>=c;
 return '<div class="item'+(ok?' afford':'')+'"><div class="tile">'+ic+'</div><div class="body"><div class="top"><b>'+t+'</b>'+lv+'</div><small>'+d+'</small>'+(eff?'<div class="eff">'+eff+'</div>':'')+(c?'<div class="meter" aria-hidden="true"><i style="width:'+pct+'%"></i></div>':'')+'</div>'+btn+'</div>';
}
function draw(){
 let h='';
 if(view==='shop'){
  h=`<div class="shophead"><h2>🛒 Magasin</h2><div class="bal">${fmt(S.score)} ${COIN}</div></div><div class="tabs"><button class="tab" data-cat="opt" aria-pressed="${shopCat==='opt'}">Bruits</button><button class="tab" data-cat="skin" aria-pressed="${shopCat==='skin'}">Skins</button></div>`;
  if(shopCat==='opt'){
   SNDS.forEach(k=>{
    const owned=S.ownSnd.includes(k.id),on=S.sndSel===k.id;
    const btn=owned?'<button class="buy" data-sel="'+k.id+'">'+(on?'Actif':'Choisir')+'</button>':'<button class="buy" data-bsnd="'+k.id+'" '+(S.score<k.p?'disabled':'')+'>'+fmt(k.p)+' '+COIN+'</button>';
    h+=shopItem(k.ic,k.n,k.d,owned?'<span class="lvl ok">'+(on?'Actif':'Acheté')+'</span>':'','',owned?0:k.p,'<div class="act">'+btn+'<button class="prev" data-prev="'+k.id+'">Aperçu</button></div>');
   });
   h+='<small>Touche « Actif » pour couper le son.</small>';
  }else{
   h+=`<div class="tabs"><button class="tab" data-stab="bg" aria-pressed="${shopTab==='bg'}">Arrière-plans</button><button class="tab" data-stab="ms" aria-pressed="${shopTab==='ms'}">Souris</button></div>`;
   const list=shopTab==='bg'?BG:MS,own=shopTab==='bg'?S.ownBg:S.ownMs;
   list.forEach(k=>{
    const owned=own.includes(k.id),lk=locked(k);
    const th=shopTab==='bg'?'<span class="sw2" style="background:'+k.css+'"></span>':'<span class="sw3">'+svgU(k,'t'+k.id).replace('<svg ','<svg style="width:100%;height:100%" ')+'</span>';
    const note=lk?(k.from?'Disponible à partir du '+k.from.toLocaleDateString('fr-FR',{day:'numeric',month:'long'}):'Non disponible à l’achat'):(owned?'Dans ta collection':'&nbsp;');
    const btn=owned?'<button class="buy" disabled>Possédé</button>':'<button class="buy" data-buy="'+k.id+'" data-kind="'+shopTab+'" '+(S.score<k.p||lk?'disabled':'')+'>'+(lk?'🔒':fmt(k.p)+' '+COIN)+'</button>';
    h+=shopItem(th,k.n,note,owned?'<span class="lvl ok">Possédé</span>':'','',owned||lk?0:k.p,btn);
   });
  }
 }else if(view==='rank'){
  h=`<h2>🏆 Classement · Top 100</h2><div class="live" id="live"></div><input id="pseudo" maxlength="14" placeholder="Ton pseudo" aria-label="Ton pseudo" value="${esc(S.pseudo)}"><small id="pmsg" role="status"></small><div id="rows"></div><div id="mine" class="mine"></div><small>Le score compte tous tes clics, même ceux dépensés.</small>`;
 }else if(view==='settings'){
  h=`<h2>⚙️ Paramètres</h2><div class="row"><div class="t"><b>Musique</b></div><button data-tg="music">${S.musicOn?'Activée':'Désactivée'}</button></div><div class="row"><div class="t"><b>Bruits de clic</b></div><button data-tg="sfx">${S.sfxOff?'Désactivés':'Activés'}</button></div><h3>Changer de pseudo</h3><input id="newname" maxlength="14" placeholder="Nouveau pseudo" aria-label="Nouveau pseudo"><button class="close" id="rename" style="background:var(--accent);color:#1f2430">Changer pour ${fmt(20000)} ${COIN}</button><p id="smsg" role="status"></p>`;
 }else if(view==='news'){
  h='<h2>📰 Mises à jour</h2>'+CHG.map(c=>'<div class="item upd"><div class="body"><div class="top"><b>'+c.v+'</b>'+(c.n?'<span class="lvl ok">Nouveau</span>':'')+'</div><ul>'+c.l.map(x=>'<li>'+x+'</li>').join('')+'</ul></div></div>').join('');
 }else if(view==='idea'){
  h=`<h2>💡 Une idée ?</h2><p>Dis-moi ce que tu aimerais voir dans le jeu.</p><textarea id="itxt" maxlength="300" placeholder="Ton idée…" aria-label="Ton idée"></textarea><button class="close" id="igo" style="background:var(--accent);color:#1f2430">Envoyer</button><p id="imsg" role="status"></p><div id="ilist"></div>`;
 }else if(view==='duel'){
  h=`<h2>⚔️ Duel</h2><p>Tape le pseudo d’un joueur en ligne pour le défier : 15 secondes, 1 point par clic, aucune récompense. Les clics du duel ne sont pas comptés dans ton score.</p><input id="dtarget" maxlength="14" placeholder="Pseudo de l’adversaire" aria-label="Pseudo de l’adversaire"><button class="close" id="dgo" style="background:var(--accent);color:#1f2430">Envoyer la demande</button><p id="dmsg" role="status"></p>`;
 }else if(view==='skin'){
  h=`<h2>🎨 Skins</h2><div class="tabs"><button class="tab" data-tab="bg" aria-pressed="${skinTab==='bg'}">Arrière-plans</button><button class="tab" data-tab="ms" aria-pressed="${skinTab==='ms'}">Souris</button></div>`;
  const own=skinTab==='bg'?S.ownBg:S.ownMs,cur=skinTab==='bg'?S.bg:S.ms;
  (skinTab==='bg'?BG:MS).filter(k=>own.includes(k.id)).forEach(k=>{
   const on=cur===k.id;
   const ic=skinTab==='bg'?`<span class="sw" style="background:${k.css}"></span>`:`<span class="sw" style="background:linear-gradient(160deg,${k.b[0]},${k.b[1]})"></span>`;
   const btn=on?'<button disabled>Équipé</button>':`<button data-eq="${k.id}">Équiper</button>`;
   h+=`<div class="row">${ic}<div class="t"><b>${k.n}</b></div>${btn}</div>`;
  });
  h+='<small>Pour en obtenir d’autres, va dans Magasin &gt; Skins.</small>';
 }
 h+='<button class="close" id="cl">Fermer</button>';
 $('sheet').innerHTML=h;$('cl').onclick=closeP;
 if(view==='rank'){const p=$('pseudo');p.addEventListener('change',async()=>{const v=p.value.trim().slice(0,14),m=$('pmsg');if(!v||v===S.pseudo){p.value=S.pseudo;return}m.textContent='Vérification…';if(!(await nameFree(v))){p.value=S.pseudo;m.textContent='Ce pseudo est déjà pris.';return}S.pseudo=v;save();render();m.textContent='Pseudo changé !';push();pushPlayer()});updateRows()}
 if(view==='duel')$('dgo').onclick=sendReq;
 if(view==='idea'){$('igo').onclick=sendIdea;loadIdeas()}
 if(view==='settings')$('rename').onclick=renamePseudo;
}
$('sheet').addEventListener('click',e=>{
 const t=e.target.closest('button');if(!t||t.id==='cl')return;
 if(t.dataset.cat)shopCat=t.dataset.cat;
 if(t.dataset.stab)shopTab=t.dataset.stab;
 if(t.dataset.tg==='music'){S.musicOn=!S.musicOn;if(S.musicOn)startMusic();else stopMusic()}
 if(t.dataset.tg==='sfx')S.sfxOff=!S.sfxOff;
 if(t.dataset.prev)previewSnd(t.dataset.prev);
 if(t.dataset.bsnd){const k=SNDS.find(x=>x.id===t.dataset.bsnd);if(k&&S.score>=k.p&&!S.ownSnd.includes(k.id)){S.score-=k.p;S.ownSnd.push(k.id);S.sndSel=k.id;playClick(0,k.id)}}
 if(t.dataset.sel){const id=t.dataset.sel;if(S.sndSel===id)S.sndSel='';else{S.sndSel=id;playClick(0,id)}}
 if(t.dataset.tab)skinTab=t.dataset.tab;
 if(t.dataset.buy){const kd=t.dataset.kind,s=(kd==='bg'?BG:MS).find(x=>x.id===t.dataset.buy),ow=kd==='bg'?S.ownBg:S.ownMs;
  if(s&&S.score>=s.p&&!locked(s)&&!ow.includes(s.id)){S.score-=s.p;ow.push(s.id);if(kd==='bg')S.bg=s.id;else S.ms=s.id}}
 if(t.dataset.eq){if(skinTab==='bg')S.bg=t.dataset.eq;else S.ms=t.dataset.eq}
 applySkin();render();save();draw();
});
function showWelcome(){
 const w=$('welcome'),i=$('wname'),err=$('werr'),cnt=$('wcount');
 w.style.display='flex';i.focus();
 i.addEventListener('input',()=>{cnt.textContent=i.value.length+'/14';err.textContent=''});
 const go=async()=>{const v=i.value.trim().slice(0,14);
  if(!v){err.textContent=' · Entre un pseudo pour jouer.';return}
  err.textContent=' · Vérification…';
  if(!(await nameFree(v))){err.textContent=' · Ce pseudo est déjà pris.';return}
  err.textContent='';
  S.pseudo=v;save();w.style.display='none';render();push();pushPlayer();setTimeout(maybeDaily,600)};
 $('wgo').onclick=go;
 i.addEventListener('keydown',e=>{if(e.key==='Enter')go()});
}
S.best=S.total;fixSnd();
if(S.ownBg.includes('valentin')){S.ownBg=S.ownBg.filter(x=>x!=='valentin');S.score+=250000}
if(S.bg==='valentin')S.bg='bureau';
S.pseudo=(S.pseudo||'').trim().slice(0,14);
S.mode='cloud';
if(!S.pseudo)showWelcome();
document.addEventListener('visibilitychange',save);
addEventListener('pagehide',save);
setTimeout(()=>{const n=$('intro');if(n)n.remove()},3000);
$('intro').onclick=()=>$('intro').remove();
applySkin();render();initLive();
</script>
</body>
</html>
